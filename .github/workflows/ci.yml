name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Sandboxes pull :latest, so a push to main reaches the next sandbox with no deploy step.
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/demo-spa
      tags: |
        ghcr.io/cujarrett/demo-spa:latest
        ghcr.io/cujarrett/demo-spa:sha-${{ github.sha }}
      cache-scope: demo-spa
