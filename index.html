<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your sandbox app - Created by Launchpad</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Dark like Launchpad, so it feels related. A fuchsia accent and its own top bar,
       so a guest can tell it is their own app and not another Launchpad page. */
    :root {
      color-scheme: dark;
      --bg: #120f1a;
      --surface: #1c1726;
      --surface-alt: #251e33;
      --border: #342a47;
      --text: #ece6f5;
      --text-dim: #9a8fae;
      --accent: #e879f9;
      --accent-strong: #c026d3;
      --accent-soft: rgba(232, 121, 249, 0.14);
      --ok: #4ade80;
      --bad: #fb7185;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html { background: var(--bg); }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem 1rem;
      flex-wrap: wrap;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, rgba(192, 38, 211, 0.18), transparent 60%);
      font-size: 0.85rem;
    }
    .app-name { font-weight: 700; }
    .app-name .sub { font-weight: 400; color: var(--text-dim); }
    .made-by { color: var(--text-dim); }
    .made-by a { color: var(--accent); }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.75rem 1rem 1.25rem;
    }
    h1 {
      font-size: clamp(1.7rem, 6vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    h1 b { color: var(--accent); }
    .lede {
      margin: 0.5rem 0 1.25rem;
      color: var(--text-dim);
      max-width: 40rem;
    }
    .lede strong { color: var(--text); }

    .error-banner {
      display: none;
      margin-bottom: 1rem;
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      background: rgba(251, 113, 133, 0.12);
      color: var(--bad);
      font-size: 0.85rem;
    }

    .services {
      display: grid;
      /* Four services fit one row on a laptop screen. */
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .service {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color 0.4s;
    }
    .service.flash { border-color: var(--accent); }
    .service-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .product {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .where {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .state {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ok);
    }
    .service.error .state { color: var(--bad); }
    .service.starting .state { color: var(--text-dim); }
    .latency {
      margin-top: 0.4rem;
      font-family: var(--mono);
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }
    .latency small { font-size: 0.9rem; color: var(--text-dim); }
    .spark { width: 100%; height: 28px; }
    .spark polyline { fill: none; stroke: var(--accent-strong); stroke-width: 2; }
    .did {
      font-size: 0.85rem;
      color: var(--text-dim);
    }
    .count {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .not-added {
      margin-top: 0.9rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .live {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .live a { color: var(--accent); }
    .pulse {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      margin-right: 0.35rem;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      .service { transition: none; }
    }

    .access {
      margin-top: 1.25rem;
      padding: 1.1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
    }
    .access h2 { font-size: 1rem; margin-bottom: 0.5rem; }
    .access ul { list-style: none; display: grid; gap: 0.45rem; }
    .access li {
      display: grid;
      grid-template-columns: 1.25rem 1fr;
      font-size: 0.9rem;
    }
    .access li::before { content: "✓"; color: var(--ok); font-weight: 700; }
    .tech {
      padding: 0 0.35rem;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    /* Phones get one compact row per service, so every service fits on the first screen. */
    @media (max-width: 600px) {
      main { padding-top: 1.25rem; }
      .lede { margin-bottom: 1rem; font-size: 0.9rem; }
      .services { gap: 0.5rem; }
      .service {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas: "top lat" "did spark";
        gap: 0.1rem 0.75rem;
        align-items: center;
        padding: 0.65rem 0.9rem;
        border-radius: 12px;
      }
      .service-top { grid-area: top; justify-content: flex-start; }
      .service-top > div { display: flex; align-items: baseline; gap: 0.4rem; min-width: 0; }
      .service.ok .state { display: none; }
      .service.ok .product::before {
        content: "";
        display: inline-block;
        width: 0.45rem;
        height: 0.45rem;
        margin: 0 0.4rem 0.1rem 0;
        border-radius: 50%;
        background: var(--ok);
      }
      .product { font-size: 0.95rem; white-space: nowrap; }
      .where { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .latency { grid-area: lat; margin: 0; font-size: 1.35rem; text-align: right; }
      .latency small { font-size: 0.7rem; }
      .spark { grid-area: spark; width: 4rem; height: 16px; }
      .did { grid-area: did; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .count { display: none; }
      .live { margin-top: 0.75rem; }
      .access { margin-top: 1.25rem; padding: 0.9rem 1rem; }
      .access li { font-size: 0.85rem; }
    }

    /* The Launchpad mark in this page's colours. The brackets draw and the arrow lifts
       when the footer scrolls into view, then the arrow keeps a slow float. */
    .footer { display: flex; justify-content: center; padding: 0.5rem 1rem 1.5rem; }
    .footer a { display: inline-flex; line-height: 0; }
    .mark { width: 3rem; height: auto; }
    .mark .bracket path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    /* Near-white arrow inside pink brackets, so the two parts read apart. */
    .mark .arrow { fill: #fdf4ff; }
    .mark.animate .bracket path { stroke-dasharray: 120; animation: mark-draw 0.55s cubic-bezier(0.4, 0, 0.2, 1) both; }
    .mark.animate .bracket path:last-child { animation-delay: 0.08s; }
    .mark.animate .arrow {
      animation: mark-rise 0.5s cubic-bezier(0.34, 1.3, 0.64, 1) 0.4s both, mark-float 2.4s ease-in-out 1s infinite;
    }
    .footer a:hover .bracket path { stroke: var(--accent-strong); }
    @keyframes mark-draw { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
    @keyframes mark-rise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes mark-float { 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      .mark.animate .bracket path, .mark.animate .arrow { animation: none; stroke-dashoffset: 0; opacity: 1; transform: none; }
    }

    details { margin-top: 1rem; }
    summary { cursor: pointer; color: var(--text-dim); font-size: 0.85rem; }
    pre {
      margin-top: 0.6rem;
      padding: 1rem;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="app-name"><span id="workspace-name">your app</span> <span class="sub">· your sandbox app</span></div>
    <div class="made-by">Made by <a href="https://launchpad.mattjarrett.dev" target="_blank" rel="noopener noreferrer">Launchpad</a> · <span id="countdown">deleted within 10 minutes</span></div>
  </header>

  <main>
    <h1>Hello from <b id="hello-name">your app</b></h1>
    <p class="lede">
      <strong>Real round trips</strong> from your API to its services, every 5 seconds.
    </p>

    <div class="error-banner" id="error-banner"></div>

    <div class="services" id="services"></div>
    <p class="not-added" id="not-added"></p>

    <p class="live" id="live"></p>

    <section class="access" id="access" hidden>
      <h2>How your API got in</h2>
      <ul id="access-list"></ul>
    </section>

    <details id="raw" hidden>
      <summary>What the API sent</summary>
      <pre id="raw-json"></pre>
    </details>
  </main>

  <footer class="footer">
    <a href="https://launchpad.mattjarrett.dev" target="_blank" rel="noopener noreferrer" title="Made by Launchpad">
      <svg class="mark" id="mark" viewBox="0 0 80 64" role="img" aria-label="Launchpad">
        <g class="bracket">
          <path d="M27 10 H14 V54 H27" />
          <path d="M53 10 H66 V54 H53" />
        </g>
        <g class="arrow">
          <path d="M40 16.5 L53.5 32 H26.5 Z" />
          <rect x="35.5" y="29" width="9" height="22" rx="4.5" />
        </g>
      </svg>
    </a>
  </footer>

  <script>
    const hostname = window.location.hostname
    const apiBase = hostname.replace(/^(demo\d+)\./, '$1-api.')

    // A local preview has no sandbox hostname to derive the API from, so ?api=
    // points at a real one. Honoured only when the page itself is served locally,
    // because on a live sandbox a crafted link would choose what this page shows.
    const localPreview = ['localhost', '127.0.0.1', '[::1]', ''].includes(hostname)
    const rawOverride = new URLSearchParams(window.location.search).get('api')
    // http(s) only. The value is also used as a link's href, so javascript: would run on click.
    const apiOverride = /^https?:\/\//i.test(rawOverride ?? '') ? rawOverride : null
    const apiURL = localPreview && apiOverride ? apiOverride : `https://${apiBase}/`

    const POLL_MS = 5000
    const HISTORY = 12

    // What each service is, where it runs, and how the API got access.
    // Access lines describe how the platform wires each kind. They name no resource.
    const SERVICES = {
      'NoSQL Database': {
        product: 'DynamoDB', where: 'table in AWS',
        access: 'Its own <span class="tech">AWS IAM</span> role. No stored keys.',
      },
      'Object Storage': {
        product: 'S3', where: 'bucket in AWS',
        access: 'Its own <span class="tech">AWS IAM</span> role. No stored keys.',
      },
      'SQL Database': {
        product: 'Postgres', where: 'database in cluster',
        access: '<span class="tech">Postgres</span> password, in a private file.',
      },
      'Cache': {
        product: 'Redis', where: 'cache in cluster',
        access: '<span class="tech">Redis</span> password, in a private file.',
      },
      'Topic': {
        product: 'NATS topic', where: 'messaging in cluster',
        access: 'Connection details for its <span class="tech">NATS</span> stream, set by the platform when the pod starts.',
      },
      'Subscription': {
        product: 'NATS subscription', where: 'messaging in cluster',
        access: 'Connection details for its <span class="tech">NATS</span> subscription, set by the platform when the pod starts.',
      },
    }
    const ALWAYS = 'Allow-listed callers only. All traffic encrypted.'

    // Launchpad's public sandbox list holds each slot's expiry, for the countdown.
    const LAUNCHPAD_LIST = 'https://launchpad.mattjarrett.dev/api/guest/workspaces'
    const slot = (/^(demo\d+)\./.exec(hostname) ?? [])[1]
    let expiresAt = 0

    async function loadExpiry() {
      if (!slot) return
      try {
        const res = await fetch(LAUNCHPAD_LIST, { cache: 'no-store' })
        const list = await res.json()
        const mine = list.find(w => w.slot === slot)
        const t = Date.parse(mine?.expiresAt ?? '')
        if (!Number.isNaN(t)) expiresAt = t
      } catch { /* Keeps the "within 10 minutes" fallback. */ }
    }

    function renderCountdown() {
      if (!expiresAt) return
      const left = Math.max(0, expiresAt - Date.now())
      const m = Math.floor(left / 60000)
      const sec = String(Math.floor((left % 60000) / 1000)).padStart(2, '0')
      document.getElementById('countdown').textContent = left > 0 ? `deleted in ${m}:${sec}` : 'being deleted now'
    }

    const history = {}
    const rounds = {}
    let lastChecked = 0

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    // demo-api ends each detail with its round-trip time, such as "(9ms)".
    function splitLatency(detail) {
      const m = /\s*\((\d+(?:\.\d+)?)(m?s)\)\s*$/.exec(detail ?? '')
      if (!m) return [detail ?? '', null]
      const ms = m[2] === 's' ? Number(m[1]) * 1000 : Number(m[1])
      return [detail.slice(0, m.index), ms]
    }

    function sparkline(values) {
      if (values.length < 2) return ''
      const max = Math.max(...values), min = Math.min(...values)
      const span = max - min || 1
      const pts = values.map((v, i) => {
        const x = (i / (HISTORY - 1)) * 100
        const y = 26 - ((v - min) / span) * 24
        return `${x.toFixed(1)},${y.toFixed(1)}`
      }).join(' ')
      return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`
    }

    function serviceCard(i) {
      const info = SERVICES[i.name] ?? { product: i.name, where: '' }
      const [did, ms] = splitLatency(i.detail)
      const state = { ok: 'Connected', error: 'Failing', starting: 'Starting…' }[i.status] ?? i.status
      const latency = i.status === 'ok' && ms !== null
        ? `<div class="latency">${escapeHtml(Math.round(ms))}<small> ms</small></div>${sparkline(history[i.name] ?? [])}`
        : ''
      const count = i.status === 'ok' ? `<div class="count">round trip #${rounds[i.name] ?? 0}</div>` : ''
      return `<div class="service ${escapeHtml(i.status)}" data-name="${escapeHtml(i.name)}">
        <div class="service-top">
          <div><div class="product">${escapeHtml(info.product)}</div><div class="where">${escapeHtml(info.where)}</div></div>
          <div class="state">${escapeHtml(state)}</div>
        </div>
        ${latency}
        <div class="did">${escapeHtml(i.status === 'starting' ? 'Waiting for it to come up' : did)}</div>
        ${count}
      </div>`
    }

    function render(data) {
      const name = (data.workspace ?? '').replace(/^guest-/, '') || 'your app'
      document.getElementById('workspace-name').textContent = name
      document.getElementById('hello-name').textContent = name
      document.title = `${name} - Created by Launchpad`

      const list = data.integrations ?? []
      const added = list.filter(i => i.status !== 'not_configured')
      for (const i of added) {
        const [, ms] = splitLatency(i.detail)
        if (i.status === 'ok' && ms !== null) {
          history[i.name] = [...(history[i.name] ?? []), ms].slice(-HISTORY)
          rounds[i.name] = (rounds[i.name] ?? 0) + 1
        }
      }

      const grid = document.getElementById('services')
      grid.innerHTML = added.length
        ? added.map(serviceCard).join('')
        : '<p class="did">Your API answered. Add a database or storage in Launchpad to see it connect.</p>'
      // A brief outline on each card, so the refresh is visible.
      grid.querySelectorAll('.service.ok').forEach(el => {
        el.classList.add('flash')
        setTimeout(() => el.classList.remove('flash'), 600)
      })

      const missing = list.filter(i => i.status === 'not_configured').map(i => SERVICES[i.name]?.product ?? i.name)
      document.getElementById('not-added').textContent = missing.length ? `Not added to this sandbox: ${missing.join(', ')}.` : ''

      // Fixed strings from SERVICES only, so no API value reaches this markup.
      const lines = [...new Set(added.map(i => SERVICES[i.name]?.access).filter(Boolean)), ALWAYS]
      document.getElementById('access-list').innerHTML = lines.map(l => `<li><span>${l}</span></li>`).join('')
      document.getElementById('access').hidden = false

      document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2)
      document.getElementById('raw').hidden = false
    }

    function renderLive() {
      const host = escapeHtml(new URL(apiURL).host)
      const ago = lastChecked ? Math.round((Date.now() - lastChecked) / 1000) : null
      document.getElementById('live').innerHTML =
        `<span class="pulse"></span>Live from <a href="${escapeHtml(apiURL)}" target="_blank" rel="noopener noreferrer">${host}</a>`
        + (ago === null ? '' : ` · checked ${ago}s ago`)
    }

    async function poll() {
      const banner = document.getElementById('error-banner')
      try {
        const res = await fetch(apiURL, { cache: 'no-store' })
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        render(await res.json())
        lastChecked = Date.now()
        banner.style.display = 'none'
      } catch (err) {
        // A network error usually means the API is still starting.
        banner.textContent = err.message === 'Failed to fetch'
          ? 'Your API is still starting. Trying again…'
          : `Your API answered with an error (${err.message}). Trying again…`
        banner.style.display = 'block'
      }
      renderLive()
    }

    // The footer sits below the fold, so the mark animates when it comes into view.
    const mark = document.getElementById('mark')
    new IntersectionObserver(([e], obs) => {
      if (e.isIntersecting) { mark.classList.add('animate'); obs.disconnect() }
    }).observe(mark)

    poll()
    loadExpiry()
    setInterval(poll, POLL_MS)
    setInterval(() => { renderLive(); renderCountdown() }, 1000)
  </script>
</body>
</html>
