<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Launchpad sandbox app</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* A light, teal look on purpose. Launchpad is dark and purple, so a guest can
       tell at a glance they have left Launchpad and are looking at their own app. */
    :root {
      color-scheme: light;
      --bg: #f6f8f7;
      --surface: #ffffff;
      --border: #dfe5e3;
      --text: #14211d;
      --text-dim: #5b6b66;
      --accent: #0f9d8a;
      --accent-soft: #e2f5f1;
      --bad: #c2410c;
      --bad-soft: #fdeee6;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html { background: var(--bg); }
    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .app-name { font-weight: 700; }
    .app-name .sub { font-weight: 400; color: var(--text-dim); }
    .made-by { color: var(--text-dim); }
    .made-by a { color: var(--accent); }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1rem 3rem;
    }
    h1 {
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    h1 b { color: var(--accent); }
    .lede {
      margin: 0.5rem 0 1.75rem;
      color: var(--text-dim);
    }

    .services {
      list-style: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .service {
      display: grid;
      grid-template-columns: 1.75rem 1fr auto;
      gap: 0.25rem 0.75rem;
      align-items: baseline;
      padding: 0.9rem 1rem;
      border-top: 1px solid var(--border);
    }
    .service:first-child { border-top: none; }
    .mark {
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      align-self: center;
      background: var(--border);
      color: var(--text-dim);
    }
    .service.ok .mark { background: var(--accent-soft); color: var(--accent); }
    .service.error .mark { background: var(--bad-soft); color: var(--bad); }
    .service-name { font-weight: 600; }
    .tech {
      display: inline-block;
      margin-left: 0.35rem;
      padding: 0 0.4rem;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .service-detail {
      grid-column: 2;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    .latency {
      grid-row: 1;
      grid-column: 3;
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .service.not_configured { opacity: 0.55; }
    .service.error .service-detail { color: var(--bad); }

    .live {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .live a { color: var(--accent); }
    .pulse {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      margin-right: 0.35rem;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

    .error-banner {
      display: none;
      margin-bottom: 1rem;
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      background: var(--bad-soft);
      color: var(--bad);
      font-size: 0.85rem;
    }

    details { margin-top: 1.5rem; }
    summary { cursor: pointer; color: var(--text-dim); font-size: 0.85rem; }
    pre {
      margin-top: 0.6rem;
      padding: 1rem;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="app-name"><span id="workspace-name">your app</span> <span class="sub">· your sandbox app</span></div>
    <div class="made-by">Made by <a href="https://launchpad.mattjarrett.dev" target="_blank" rel="noopener noreferrer">Launchpad</a> · deleted within 10 minutes</div>
  </header>

  <main>
    <h1>Hello from <b id="hello-name">your app</b></h1>
    <p class="lede" id="lede">Asking your API what it can reach…</p>

    <div class="error-banner" id="error-banner"></div>

    <ul class="services" id="services"></ul>

    <p class="live" id="live"></p>

    <details id="raw" hidden>
      <summary>What the API sent</summary>
      <pre id="raw-json"></pre>
    </details>
  </main>

  <script>
    const hostname = window.location.hostname
    const apiBase = hostname.replace(/^(demo\d+)\./, '$1-api.')

    // A local preview has no sandbox hostname to derive the API from, so ?api=
    // points at a real one. Honoured only when the page itself is served locally,
    // because on a live sandbox a crafted link would choose what this page shows.
    const localPreview = ['localhost', '127.0.0.1', '[::1]', ''].includes(hostname)
    const rawOverride = new URLSearchParams(window.location.search).get('api')
    // http(s) only. The value is also used as a link's href, so javascript: would run on click.
    const apiOverride = /^https?:\/\//i.test(rawOverride ?? '') ? rawOverride : null
    const apiURL = localPreview && apiOverride ? apiOverride : `https://${apiBase}/`

    // Plain names, plus the product behind each, so anyone can see these are real services.
    const SERVICES = {
      'SQL Database': ['Database', 'Postgres'],
      'Cache': ['Cache', 'Redis'],
      'NoSQL Database': ['Table', 'DynamoDB'],
      'Object Storage': ['File storage', 'S3'],
      'Topic': ['Message topic', 'NATS'],
      'Subscription': ['Message subscription', 'NATS'],
    }
    const MARKS = { ok: '✓', error: '!', starting: '…', not_configured: '–' }

    let lastChecked = 0

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }

    // demo-api ends each detail with its round-trip time, such as "(9ms)". Shown on its own.
    function splitLatency(detail) {
      const m = /\s*\((\d+(?:\.\d+)?m?s)\)\s*$/.exec(detail ?? '')
      return m ? [detail.slice(0, m.index), m[1]] : [detail ?? '', '']
    }

    function detailText(i) {
      if (i.status === 'not_configured') return 'Not added to this sandbox'
      if (i.status === 'starting') return 'Starting up…'
      return i.detail ?? ''
    }

    function render(data) {
      const name = (data.workspace ?? '').replace(/^guest-/, '') || 'your app'
      document.getElementById('workspace-name').textContent = name
      document.getElementById('hello-name').textContent = name

      const list = data.integrations ?? []
      const added = list.filter(i => i.status !== 'not_configured')
      const working = added.filter(i => i.status === 'ok')
      document.getElementById('lede').textContent = added.length === 0
        ? 'Your API answered. Add a database or storage in Launchpad to see it connect.'
        : working.length === added.length
          ? 'Your API answered, and reached every service you added.'
          : `Your API answered. ${working.length} of ${added.length} services are connected so far.`

      // Added services first, so the real round trips lead.
      const ordered = [...added, ...list.filter(i => i.status === 'not_configured')]
      document.getElementById('services').innerHTML = ordered.map(i => {
        const [label, tech] = SERVICES[i.name] ?? [i.name, '']
        const [text, latency] = splitLatency(detailText(i))
        return `<li class="service ${escapeHtml(i.status)}">
          <span class="mark">${MARKS[i.status] ?? '?'}</span>
          <span class="service-name">${escapeHtml(label)}${tech ? `<span class="tech">${escapeHtml(tech)}</span>` : ''}</span>
          <span class="latency">${escapeHtml(latency)}</span>
          <span class="service-detail">${escapeHtml(text)}</span>
        </li>`
      }).join('')

      document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2)
      document.getElementById('raw').hidden = false
    }

    function renderLive() {
      const live = document.getElementById('live')
      const host = escapeHtml(new URL(apiURL).host)
      const ago = lastChecked ? Math.round((Date.now() - lastChecked) / 1000) : null
      live.innerHTML = `<span class="pulse"></span>Live from <a href="${escapeHtml(apiURL)}" target="_blank" rel="noopener noreferrer">${host}</a>`
        + (ago === null ? '' : ` · checked ${ago}s ago`)
    }

    async function poll() {
      const banner = document.getElementById('error-banner')
      try {
        const res = await fetch(apiURL, { cache: 'no-store' })
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        render(await res.json())
        lastChecked = Date.now()
        banner.style.display = 'none'
      } catch (err) {
        // A network error usually means the API is still starting.
        banner.textContent = err.message === 'Failed to fetch'
          ? 'Your API is still starting. Trying again…'
          : `Your API answered with an error (${err.message}). Trying again…`
        banner.style.display = 'block'
      }
      renderLive()
    }

    poll()
    setInterval(poll, 5000)
    setInterval(renderLive, 1000)
  </script>
</body>
</html>
